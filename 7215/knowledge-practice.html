const KEY='idat7215-knowledge-practice-v1';let record={};try{record=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch{record={}}
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');
function norm(s){return String(s||'').toLowerCase().replace(/[\s，,。；;：:、\/()（）]/g,'')}
function save(){localStorage.setItem(KEY,JSON.stringify(record))}
function filtered(){const w=$('weekFilter').value,t=$('typeFilter').value;return questions.filter(q=>(w==='all'||q.week===w)&&(t==='all'||(t==='review'?record[q.id]?.status==='review':q.type===t)))}
function updateStats(){const m=questions.filter(q=>record[q.id]?.status==='mastered').length,r=questions.filter(q=>record[q.id]?.status==='review').length;$('stats').textContent=`已掌握 ${m}/${questions.length} · 待复习 ${r} · 共 ${questions.length} 题`;$('progress').style.width=Math.round(m/questions.length*100)+'%'}
function grouped(list){const weeks=[];for(const q of list){let w=weeks.find(x=>x.week===q.week);if(!w){w={week:q.week,topics:[]};weeks.push(w)}let t=w.topics.find(x=>x.point===q.point);if(!t){t={point:q.point,items:[]};w.topics.push(t)}t.items.push(q)}return weeks}
function terms(q){return `${pointTermsZh[q.point]||q.point} / ${q.terms}`}
function fillQuestion(q,n){const r=record[q.id]||{},answers=q.a[0].split(/\s*,\s*/);let slot=0;const prompt=q.q.replace(/____/g,()=>{const i=slot++,value=r.draft?.[i]||'';return `<span class="blank-wrap"><input class="blank ${r.checked?((r.results||[])[i]?'ok':'bad'):''}" aria-label="第 ${n} 题第 ${i+1} 个填空" data-qid="${q.id}" data-slot="${i}" value="${esc(value)}"><span class="answer-key ${r.revealed?'show':''}">${esc(answers[i]||'')}</span></span>`});return `<div class="qrow" id="item-${q.id}" data-item-id="${q.id}"><div class="qmeta">填空 ${n} <span class="badge">${r.status==='mastered'?'已掌握':r.status==='review'?'待复习':'待作答'}</span><span class="terms">重点词语 / KEY TERMS · ${esc(terms(q))}</span></div><div class="prompt">${fmt(prompt)}</div><div class="actions"><button class="btn" onclick="checkFill('${q.id}')">核对本题</button><button class="btn secondary" onclick="revealFill('${q.id}')">显示答案</button><button class="btn ghost" onclick="mark('${q.id}','review')">标为待复习</button></div><div class="feedback ${r.checked?'show '+(r.status==='mastered'?'correct':'wrong'):''}" id="feedback-${q.id}">${r.checked?(r.status==='mastered'?'全部正确 ✓':`有空格需要订正。参考答案：${esc(answers.join('；'))}`):''}</div></div>`}
function shortQuestion(q,n){const r=record[q.id]||{};return `<div class="short-row" id="item-${q.id}" data-item-id="${q.id}"><div class="qmeta">简答 ${n} <span class="badge">${r.status==='mastered'?'已掌握':r.status==='review'?'待复习':'待作答'}</span><span class="terms">重点词语 / KEY TERMS · ${esc(terms(q))}</span></div><h4>${fmt(q.q)}</h4><textarea data-short="${q.id}" placeholder="先写下自己的回答，再对照参考要点">${esc(r.draft||'')}</textarea><div class="actions"><button class="btn secondary" onclick="revealShort('${q.id}')">查看参考要点</button><button class="btn" onclick="mark('${q.id}','mastered')">我会了</button><button class="btn ghost" onclick="mark('${q.id}','review')">需复习</button></div><div class="reference ${r.revealed?'show':''}" id="reference-${q.id}"><b>参考要点：</b>${esc(q.a)}</div></div>`}
function render(){updateStats();const list=filtered(),fills=list.filter(q=>q.type==='blank'),shorts=list.filter(q=>q.type==='short');let html='';if(fills.length){html+='<h2 class="section-title">知识点填空</h2>';let num=0;for(const w of grouped(fills)){html+=`<h2 class="chapter">${labels[w.week]}</h2>`;for(const t of w.topics){html+=`<section class="topic"><h3>${esc(t.point)}　<span style="font-weight:400;color:var(--muted);font-size:12px">${esc(pointEnglish[t.point]||'')}</span></h3>`;for(const q of t.items)html+=fillQuestion(q,++num);html+='</section>'}}}if(shorts.length){html+='<h2 class="section-title">简答自测</h2>';let num=0;for(const w of grouped(shorts)){html+=`<h2 class="chapter">${labels[w.week]}</h2>`;for(const t of w.topics){html+=`<section class="topic"><h3>${esc(t.point)}　<span style="font-weight:400;color:var(--muted);font-size:12px">${esc(pointEnglish[t.point]||'')}</span></h3>`;for(const q of t.items)html+=shortQuestion(q,++num);html+='</section>'}}}if(!html)html='<section class="card empty">当前筛选没有待复习题目。你可以切换周次或做题状态。</section>'; $('worksheet').innerHTML=html;document.querySelectorAll('[data-qid]').forEach(el=>el.addEventListener('input',()=>{const id=el.dataset.qid,slot=Number(el.dataset.slot);record[id]??={};record[id].draft??=[];record[id].draft[slot]=el.value;save()}));document.querySelectorAll('[data-short]').forEach(el=>el.addEventListener('input',()=>{record[el.dataset.short]??={};record[el.dataset.short].draft=el.value;save()}))}
function checkFill(id){const q=questions.find(x=>x.id===id),inputs=[...document.querySelectorAll(`[data-qid="${id}"]`)],answers=q.a[0].split(/\s*,\s*/);if(inputs.some(x=>!x.value.trim())){alert('请先填写本题所有空格。');return}const results=inputs.map((x,i)=>norm(x.value)===norm(answers[i]||''));record[id]??={};record[id].checked=true;record[id].results=results;record[id].revealed=true;record[id].status=results.every(Boolean)?'mastered':'review';record[id].attempts=(record[id].attempts||0)+1;record[id].updatedAt=Date.now();save();render()}
function revealFill(id){record[id]??={};record[id].revealed=true;save();render()}
function revealShort(id){record[id]??={};record[id].revealed=true;save();render()}
function mark(id,status){record[id]??={};record[id].status=status;record[id].attempts=(record[id].attempts||0)+1;record[id].updatedAt=Date.now();save();render()}
function randomQuestion(){const list=filtered();if(!list.length)return;const q=list[Math.floor(Math.random()*list.length)];document.getElementById(`item-${q.id}`)?.scrollIntoView({behavior:'smooth',block:'center'})}
$('weekFilter').addEventListener('change',render);$('typeFilter').addEventListener('change',render);render();
</script></body></html>
